<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SitBit — Redirecting...</title>
  <script>
    window.addEventListener('load', function() {
      var path = window.location.pathname;
      var appUrl = 'intent://sitbit.co' + path + '#Intent;scheme=https;package=co.sitbit.sitbit;end';
      window.location.href = appUrl;
      setTimeout(function() {
        window.location.href = 'https://play.google.com/store/apps/details?id=co.sitbit.sitbit';
      }, 2000);
    });
  </script>
</head>
<body style="background:#0f0f0f;color:white;font-family:sans-serif;text-align:center;padding:40px;">
  <p style="color:#999;">Opening SitBit...</p>
</body>
</html>
