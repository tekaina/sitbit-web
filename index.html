<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SitBit — Join the Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .emoji { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 28px; color: #FF6B2B; margin-bottom: 12px; }
    p { color: #999; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      background: #FF6B2B;
      color: white;
      padding: 16px 36px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.3px;
    }
    .hint {
      margin-top: 20px;
      font-size: 12px;
      color: #444;
    }
  </style>
  <script>
    // Try to open the app via deep link, fall back to Play Store
    window.addEventListener('load', function() {
      var path = window.location.pathname;
      var sessionMatch = path.match(/\/group-sessions\/([^/]+)/);
      if (sessionMatch) {
        var sessionId = sessionMatch[1];
        // Android intent deep link
        var appUrl = 'intent://sitbit.co' + path + '#Intent;scheme=https;package=co.sitbit.sitbit;end';
        window.location.href = appUrl;
        // Fallback to Play Store after 2s if app not installed
        setTimeout(function() {
          window.location.href = 'https://play.google.com/store/apps/details?id=co.sitbit.sitbit';
        }, 2000);
      }
    });
  </script>
</head>
<body>
  <div class="card">
    <div class="emoji">⚽</div>
    <h1>You're invited to play!</h1>
    <p>Open SitBit to join the game,<br>claim your position on the field,<br>and play with your squad.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=co.sitbit.sitbit">
      📲 Get SitBit Free
    </a>
    <p class="hint">Already have SitBit? The link will open automatically.</p>
  </div>
</body>
</html>
